<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="4300" height="1620" viewBox="0 0 4300 1620">
  <defs>
    <marker id="arrow" viewBox="0 0 30 30" markerWidth="24" markerHeight="24" refX="28.5" refY="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,2 L29,15 L1,28 Z" fill="#20242a"/>
    </marker>
    <style><![CDATA[
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #17191c; }
      .outer { fill: #ffffff; stroke: #737b84; stroke-width: 5; stroke-dasharray: 20 14; rx: 24; }
      .cluster { fill: #ffffff; stroke: #858c94; stroke-width: 4; stroke-dasharray: 15 11; rx: 20; }
      .box { fill: #ffffff; stroke: #20242a; stroke-width: 6; rx: 20; }
      .soft { fill: #f3f5f7; stroke: #20242a; stroke-width: 5; rx: 17; }
      .anchor { fill: #eceff2; stroke: #111418; stroke-width: 7; rx: 20; }
      .title { font-size: 48px; font-weight: 700; }
      .cluster-title { font-size: 32px; font-weight: 700; fill: #505861; }
      .node-title { font-size: 36px; font-weight: 700; }
      .node-subtitle { font-size: 27px; font-weight: 600; fill: #545c65; }
      .body { font-size: 27px; }
      .small { font-size: 23px; }
      .edge-label { font-size: 24px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 9px; stroke-linejoin: round; }
      .flow { fill: none; stroke: #20242a; stroke-width: 5; marker-end: url(#arrow); }
      .control { fill: none; stroke: #525a63; stroke-width: 5; stroke-dasharray: 15 10; marker-end: url(#arrow); }
      .audit { fill: none; stroke: #3f4852; stroke-width: 5; stroke-dasharray: 18 8 4 8; marker-end: url(#arrow); }
      .divider { stroke: #858c94; stroke-width: 3; }
    ]]></style>
  </defs>

  <rect width="4300" height="1620" fill="#ffffff"/>
  <text class="title" x="2150" y="66" text-anchor="middle">异构联盟链可审计语义查询框架</text>
  <rect class="outer" x="32" y="98" width="4236" height="1460"/>

  <!-- Trust and execution regions -->
  <rect class="cluster" x="65" y="285" width="465" height="775"/>
  <text class="cluster-title" x="297" y="330" text-anchor="middle">异构源链 / 链下材料</text>

  <rect class="cluster" x="565" y="285" width="445" height="775"/>
  <text class="cluster-title" x="787" y="330" text-anchor="middle">异构适配层</text>

  <rect class="cluster" x="1045" y="285" width="2100" height="820"/>
  <text class="cluster-title" x="2095" y="330" text-anchor="middle">链下查询执行网络</text>

  <rect class="cluster" x="3180" y="155" width="1055" height="590"/>
  <text class="cluster-title" x="3707" y="202" text-anchor="middle">目标链：查询登记、根锚定与结果回调</text>

  <rect class="cluster" x="3180" y="770" width="570" height="680"/>
  <text class="cluster-title" x="3465" y="815" text-anchor="middle">链下审计域</text>

  <!-- Source systems -->
  <rect class="box" x="100" y="365" width="395" height="170"/>
  <text class="node-title" x="297" y="423" text-anchor="middle">Fabric</text>
  <text class="small" x="297" y="469" text-anchor="middle">状态 · 交易 · 事件</text>
  <text class="small" x="297" y="505" text-anchor="middle">读写集 · 背书 · 区块位置</text>

  <rect class="box" x="100" y="590" width="395" height="170"/>
  <text class="node-title" x="297" y="648" text-anchor="middle">FISCO-BCOS</text>
  <text class="small" x="297" y="694" text-anchor="middle">交易回执 · 合约事件</text>
  <text class="small" x="297" y="730" text-anchor="middle">群组 · 区块头 · 节点信息</text>

  <rect class="box" x="100" y="815" width="395" height="170"/>
  <text class="node-title" x="297" y="873" text-anchor="middle">链下业务材料</text>
  <text class="small" x="297" y="919" text-anchor="middle">文档 · 数据库快照</text>
  <text class="small" x="297" y="955" text-anchor="middle">提供者 · 版本 · 摘要 · 签名</text>

  <!-- Adapters -->
  <rect class="soft" x="605" y="365" width="365" height="170"/>
  <text class="node-title" x="787" y="423" text-anchor="middle">Fabric 适配器</text>
  <text class="small" x="787" y="471" text-anchor="middle">resolve · fetch</text>
  <text class="small" x="787" y="507" text-anchor="middle">verify_metadata</text>

  <rect class="soft" x="605" y="590" width="365" height="170"/>
  <text class="node-title" x="787" y="648" text-anchor="middle">FISCO 适配器</text>
  <text class="small" x="787" y="696" text-anchor="middle">resolve · fetch</text>
  <text class="small" x="787" y="732" text-anchor="middle">verify_metadata</text>

  <rect class="soft" x="605" y="815" width="365" height="170"/>
  <text class="node-title" x="787" y="873" text-anchor="middle">材料适配器</text>
  <text class="small" x="787" y="921" text-anchor="middle">授权定位 · 版本读取</text>
  <text class="small" x="787" y="957" text-anchor="middle">规范化 · 来源签名</text>

  <!-- Source-to-adapter paths: each is independent -->
  <path class="flow" d="M495 450 H605"/>
  <path class="flow" d="M495 675 H605"/>
  <path class="flow" d="M495 900 H605"/>

  <!-- Query compiler and DAG scheduler -->
  <rect class="box" x="1090" y="365" width="450" height="220"/>
  <text class="node-subtitle" x="1315" y="412" text-anchor="middle">查询定义 Q</text>
  <text class="node-title" x="1315" y="468" text-anchor="middle">查询编译器</text>
  <line class="divider" x1="1130" y1="493" x2="1500" y2="493"/>
  <text class="small" x="1315" y="535" text-anchor="middle">谓词模板 · 证据模式 · 风险策略</text>
  <text class="small" x="1315" y="566" text-anchor="middle">输出：版本化 DAG 描述</text>

  <rect class="box" x="1090" y="650" width="450" height="345"/>
  <text class="node-title" x="1315" y="706" text-anchor="middle">证据 DAG 调度器</text>
  <line class="divider" x1="1130" y1="731" x2="1500" y2="731"/>
  <text class="body" x="1315" y="778" text-anchor="middle">拓扑就绪 · 并行取证</text>
  <text class="body" x="1315" y="820" text-anchor="middle">节点预算 · 缓存 · 去重</text>
  <text class="body" x="1315" y="862" text-anchor="middle">重试 · 替代端点 · 失败传播</text>
  <text class="small" x="1315" y="930" text-anchor="middle">输出：节点任务与证据包</text>

  <path class="flow" d="M1315 585 V650"/>
  <text class="edge-label" x="1337" y="625">DAG / 节点预算</text>

  <!-- Adapter-to-scheduler evidence objects: separate ports and curves -->
  <path class="flow" d="M970 450 C1035 450 1030 710 1090 710"/>
  <path class="flow" d="M970 675 C1035 675 1035 790 1090 790"/>
  <path class="flow" d="M970 900 C1035 900 1035 885 1090 885"/>
  <text class="edge-label" x="985" y="1018">统一证据对象 E：原始负载＋规范化负载＋来源定位</text>

  <!-- Deterministic validator -->
  <rect class="box" x="1620" y="455" width="430" height="430"/>
  <text class="node-title" x="1835" y="516" text-anchor="middle">确定性验证器</text>
  <line class="divider" x1="1660" y1="542" x2="2010" y2="542"/>
  <text class="body" x="1835" y="591" text-anchor="middle">来源 · 定位 · 终局性</text>
  <text class="body" x="1835" y="634" text-anchor="middle">时效 · 模式 · 任务绑定</text>
  <text class="body" x="1835" y="677" text-anchor="middle">可重放业务规则</text>
  <text class="small" x="1835" y="742" text-anchor="middle">输入：证据对象 / 规则版本</text>
  <text class="small" x="1835" y="784" text-anchor="middle">输出：验证记录、原因代码</text>
  <text class="small" x="1835" y="826" text-anchor="middle">与已验证证据根</text>

  <path class="flow" d="M1540 790 C1575 790 1575 670 1620 670"/>
  <text class="edge-label" x="1548" y="748">就绪节点</text>

  <!-- Pluggable semantic service pool -->
  <rect class="box" x="2110" y="365" width="500" height="620"/>
  <text class="node-title" x="2360" y="423" text-anchor="middle">可插拔语义服务池</text>
  <text class="node-subtitle" x="2360" y="463" text-anchor="middle">能力 / 权限 / 版本 / 信誉 / 负载筛选</text>
  <rect class="soft" x="2150" y="505" width="420" height="105"/>
  <rect class="soft" x="2150" y="635" width="420" height="105"/>
  <rect class="soft" x="2150" y="765" width="420" height="105"/>
  <text class="body" x="2360" y="570" text-anchor="middle">规则服务</text>
  <text class="body" x="2360" y="700" text-anchor="middle">领域模型</text>
  <text class="body" x="2360" y="830" text-anchor="middle">LLM Agent</text>
  <text class="small" x="2360" y="922" text-anchor="middle">输出 Jᵢ：判断 · 证据引用 · 版本 · 签名</text>

  <path class="flow" d="M2050 600 H2110"/>
  <text class="edge-label" x="2025" y="578">已验证任务包</text>

  <!-- Conflict resolver -->
  <rect class="box" x="2660" y="410" width="480" height="510"/>
  <text class="node-title" x="2900" y="468" text-anchor="middle">冲突解析器</text>
  <line class="divider" x1="2700" y1="493" x2="3100" y2="493"/>
  <text class="body" x="2900" y="541" text-anchor="middle">基础设施 / 证据</text>
  <text class="body" x="2900" y="583" text-anchor="middle">执行上下文 / 语义冲突</text>
  <text class="small" x="2900" y="646" text-anchor="middle">替代端点 · 补充取证</text>
  <text class="small" x="2900" y="684" text-anchor="middle">追加服务 · 可选仲裁</text>
  <line class="divider" x1="2700" y1="720" x2="3100" y2="720"/>
  <text class="small" x="2900" y="767" text-anchor="middle">输出：三值业务结果或 INSUFFICIENT</text>
  <text class="small" x="2900" y="808" text-anchor="middle">并保留冲突与恢复记录</text>

  <path class="flow" d="M2610 650 H2660"/>
  <text class="edge-label" x="2580" y="628">结构化判断 Jᵢ</text>

  <!-- Deterministic bypass: no semantic service when rules suffice -->
  <path class="flow" d="M1835 885 V1040 H2740 V920"/>
  <text class="edge-label" x="2050" y="1022">确定性结果（无需调用语义服务）</text>

  <!-- Bounded recovery feedback to the DAG scheduler -->
  <path class="control" d="M3050 920 V1190 H1315 V995"/>
  <text class="edge-label" x="1920" y="1172">分层恢复：重试 / 切换端点 / 补充材料 / 追加服务（有限预算）</text>

  <!-- Target-chain coordination contract -->
  <rect class="anchor" x="3220" y="245" width="520" height="360"/>
  <text class="node-title" x="3480" y="305" text-anchor="middle">协调合约</text>
  <line class="divider" x1="3265" y1="330" x2="3695" y2="330"/>
  <text class="body" x="3480" y="378" text-anchor="middle">查询登记：qid / query_digest</text>
  <text class="body" x="3480" y="421" text-anchor="middle">终态：SATISFIED / UNSATISFIED</text>
  <text class="body" x="3480" y="464" text-anchor="middle">INSUFFICIENT / FAILED</text>
  <text class="body" x="3480" y="507" text-anchor="middle">锚定：receipt_root / 时间索引</text>
  <text class="small" x="3480" y="563" text-anchor="middle">只保存定长摘要和必要索引</text>

  <!-- Business contract -->
  <rect class="box" x="3800" y="290" width="400" height="400"/>
  <text class="node-title" x="4000" y="352" text-anchor="middle">业务合约</text>
  <line class="divider" x1="3835" y1="377" x2="4165" y2="377"/>
  <text class="body" x="4000" y="425" text-anchor="middle">提交查询 Q</text>
  <text class="small" x="4000" y="468" text-anchor="middle">谓词 · 证据需求 · 风险</text>
  <text class="small" x="4000" y="505" text-anchor="middle">deadline · return_policy</text>
  <text class="body" x="4000" y="558" text-anchor="middle">核对 qid / 谓词摘要 / 回执根</text>
  <text class="body" x="4000" y="606" text-anchor="middle">消费结构化结果</text>

  <!-- Query registration and result callback use separate one-way lines -->
  <path class="control" d="M3800 400 H3740"/>
  <text class="edge-label" x="3748" y="378">查询 Q</text>
  <path class="flow" d="M3740 540 H3800"/>
  <text class="edge-label" x="3748" y="585">结果回调</text>

  <!-- Contract emits immutable task parameters to the compiler -->
  <path class="control" d="M3220 300 V215 H1315 V365"/>
  <text class="edge-label" x="2110" y="198">任务事件：qid＋不可变查询摘要＋版本＋截止时间</text>

  <!-- Audit receipt store -->
  <rect class="box" x="3220" y="840" width="500" height="300"/>
  <text class="node-title" x="3470" y="900" text-anchor="middle">审计回执库</text>
  <line class="divider" x1="3260" y1="925" x2="3680" y2="925"/>
  <text class="body" x="3470" y="973" text-anchor="middle">Receipt_Q：DAG 版本与节点状态</text>
  <text class="body" x="3470" y="1016" text-anchor="middle">证据引用 · 验证记录 · 服务输出</text>
  <text class="body" x="3470" y="1059" text-anchor="middle">重试 · 冲突 · 恢复 · 最终结果</text>
  <text class="small" x="3470" y="1110" text-anchor="middle">输出：完整回执与 receipt_root</text>

  <path class="flow" d="M3140 700 H3180 V930 H3220"/>
  <text class="edge-label" x="3148" y="758">结果＋执行轨迹</text>

  <!-- Receipt-root anchoring is distinct from full receipt storage -->
  <path class="audit" d="M3580 840 V605"/>
  <text class="edge-label" x="3605" y="742">终态＋receipt_root</text>

  <!-- Authorized auditor -->
  <rect class="soft" x="3220" y="1230" width="500" height="170"/>
  <text class="node-title" x="3470" y="1290" text-anchor="middle">授权审计者</text>
  <text class="small" x="3470" y="1335" text-anchor="middle">核对链上根并沿 DAG 逆向追溯</text>
  <text class="small" x="3470" y="1372" text-anchor="middle">重验证据、签名、时效与规则</text>
  <path class="audit" d="M3470 1140 V1230"/>
  <text class="edge-label" x="3495" y="1195">授权读取与审计追溯</text>

  <!-- Legend -->
  <g transform="translate(110 1505)">
    <path class="flow" d="M0 0 H110"/>
    <text class="small" x="135" y="9">证据 / 判断 / 结果流</text>
    <path class="control" d="M500 0 H610"/>
    <text class="small" x="635" y="9">查询控制与有界恢复</text>
    <path class="audit" d="M1070 0 H1180"/>
    <text class="small" x="1205" y="9">回执根锚定与审计追溯</text>
  </g>
</svg>
