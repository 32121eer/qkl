<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="3000" height="1480" viewBox="0 0 3000 1480">
  <defs>
    <marker id="arrow" viewBox="0 0 30 30" markerWidth="30" markerHeight="30" refX="28.5" refY="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,2 L29,15 L1,28 Z" fill="#1f2328"/>
    </marker>
    <marker id="source-arrow" viewBox="0 0 30 30" markerWidth="18" markerHeight="18" refX="28.5" refY="15" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,2 L29,15 L1,28 Z" fill="#1f2328"/>
    </marker>
    <style><![CDATA[
      text { font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #17191c; }
      .layer { fill: #ffffff; stroke: #747b83; stroke-width: 5; stroke-dasharray: 22 16; rx: 22; }
      .box { fill: #ffffff; stroke: #1f2328; stroke-width: 7; rx: 22; }
      .soft { fill: #f3f5f7; stroke: #1f2328; stroke-width: 5; rx: 16; }
      .subtle { fill: #fafafa; stroke: #626a73; stroke-width: 4; rx: 14; }
      .title { font-size: 46px; font-weight: 700; }
      .layer-label { font-size: 41px; font-weight: 700; }
      .box-title { font-size: 40px; font-weight: 700; }
      .body { font-size: 34px; font-weight: 400; }
      .small { font-size: 30px; font-weight: 400; }
      .route { font-size: 31px; font-weight: 600; paint-order: stroke; stroke: #ffffff; stroke-width: 9px; stroke-linejoin: round; }
      .flow { fill: none; stroke: #1f2328; stroke-width: 6; marker-end: url(#arrow); }
      .flow-dashed { fill: none; stroke: #39424c; stroke-width: 5; stroke-dasharray: 14 12; marker-end: url(#arrow); }
      .source-flow { fill: none; stroke: #1f2328; stroke-width: 4; marker-end: url(#source-arrow); }
      .port { font-size: 23px; font-weight: 600; }
      .divider { stroke: #7b828a; stroke-width: 4; }
    ]]></style>
  </defs>

  <rect width="3000" height="1480" fill="#ffffff"/>

  <!-- Three retained architectural layers -->
  <rect class="layer" x="42" y="42" width="2916" height="320"/>
  <rect class="layer" x="42" y="414" width="2916" height="674"/>
  <rect class="layer" x="42" y="1138" width="2916" height="296"/>

  <!-- Layer labels -->
  <text class="layer-label" x="78" y="126">
    <tspan x="78" dy="0">目标链</tspan>
    <tspan x="78" dy="52">FISCO-BCOS</tspan>
    <tspan class="small" x="78" dy="46">（PBFT）</tspan>
  </text>
  <text class="layer-label" x="78" y="585">
    <tspan x="78" dy="0">链下查询</tspan>
    <tspan x="78" dy="52">执行网络</tspan>
  </text>
  <text class="layer-label" x="78" y="1255">
    <tspan x="78" dy="0">源端</tspan>
    <tspan class="small" x="78" dy="47">多源证据</tspan>
  </text>

  <!-- Target-chain contract/service -->
  <rect class="box" x="410" y="88" width="1650" height="218"/>
  <text class="title" x="1235" y="139" text-anchor="middle">目标链查询合约 / 服务</text>
  <line class="divider" x1="960" y1="154" x2="960" y2="295"/>
  <line class="divider" x1="1510" y1="154" x2="1510" y2="295"/>
  <text class="box-title" x="685" y="210" text-anchor="middle">查询登记</text>
  <text class="small" x="685" y="260" text-anchor="middle">查询规范 · 任务标识</text>
  <text class="box-title" x="1235" y="210" text-anchor="middle">回执根锚定</text>
  <text class="small" x="1235" y="260" text-anchor="middle">证据与轨迹承诺</text>
  <text class="box-title" x="1785" y="210" text-anchor="middle">结果回调</text>
  <text class="small" x="1785" y="260" text-anchor="middle">状态 · 证明摘要</text>

  <rect class="box" x="2240" y="88" width="660" height="218"/>
  <text class="box-title" x="2570" y="178" text-anchor="middle">查询调用方</text>
  <text class="body" x="2570" y="235" text-anchor="middle">（轻客户端验证）</text>

  <!-- Query and callback routes -->
  <path class="flow" d="M2240 132 H2060"/>
  <text class="route" x="2084" y="104">1 查询请求</text>
  <path class="flow" d="M2060 266 H2240"/>
  <text class="route" x="2075" y="330">8 结果回传</text>

  <!-- Off-chain core -->
  <text class="box-title" x="410" y="474">链下核心</text>
  <rect class="box" x="410" y="505" width="410" height="210"/>
  <text class="box-title" x="615" y="568" text-anchor="middle">查询编译器</text>
  <text class="small" x="615" y="625" text-anchor="middle">解析目标与约束</text>
  <text class="small" x="615" y="671" text-anchor="middle">生成可执行查询计划</text>

  <rect class="box" x="940" y="505" width="480" height="210"/>
  <text class="box-title" x="1180" y="568" text-anchor="middle">证据 DAG 调度器</text>
  <text class="small" x="1180" y="625" text-anchor="middle">依赖编排 · 并行取证</text>
  <text class="small" x="1180" y="671" text-anchor="middle">端点切换 · 失败重试</text>

  <rect class="box" x="1540" y="505" width="470" height="210"/>
  <text class="box-title" x="1775" y="568" text-anchor="middle">确定性验证器</text>
  <text class="small" x="1775" y="625" text-anchor="middle">结构 · 签名 · 终局性</text>
  <text class="small" x="1775" y="671" text-anchor="middle">可复现的规则判定</text>

  <!-- Pluggable semantic services -->
  <rect class="box" x="2180" y="470" width="720" height="306"/>
  <text class="box-title" x="2540" y="525" text-anchor="middle">可插拔语义服务池</text>
  <rect class="soft" x="2210" y="558" width="210" height="164"/>
  <rect class="soft" x="2435" y="558" width="210" height="164"/>
  <rect class="soft" x="2660" y="558" width="210" height="164"/>
  <text class="body" x="2315" y="625" text-anchor="middle">规则服务</text>
  <text class="small" x="2315" y="676" text-anchor="middle">策略约束</text>
  <text class="body" x="2540" y="625" text-anchor="middle">领域模型</text>
  <text class="small" x="2540" y="676" text-anchor="middle">专业推断</text>
  <text class="body" x="2765" y="625" text-anchor="middle">LLM Agent</text>
  <text class="small" x="2765" y="676" text-anchor="middle">语义解释</text>

  <!-- Audit storage -->
  <rect class="box" x="1040" y="824" width="970" height="218"/>
  <text class="box-title" x="1525" y="878" text-anchor="middle">链下审计存储</text>
  <rect class="subtle" x="1070" y="908" width="285" height="93"/>
  <rect class="subtle" x="1382" y="908" width="285" height="93"/>
  <rect class="subtle" x="1695" y="908" width="285" height="93"/>
  <text class="body" x="1212" y="968" text-anchor="middle">证据包</text>
  <text class="body" x="1524" y="968" text-anchor="middle">执行轨迹</text>
  <text class="body" x="1838" y="968" text-anchor="middle">服务输出</text>

  <!-- Conflict resolution -->
  <rect class="box" x="2180" y="824" width="720" height="218"/>
  <text class="box-title" x="2540" y="878" text-anchor="middle">冲突解析</text>
  <text class="body" x="2540" y="935" text-anchor="middle">替代端点 · 补充取证</text>
  <text class="body" x="2540" y="982" text-anchor="middle">追加语义服务 · 可选仲裁</text>
  <text class="small" x="2540" y="1024" text-anchor="middle">仅在证据或服务输出冲突时触发</text>

  <!-- Core execution paths -->
  <path class="flow" d="M615 306 V505"/>
  <text class="route" x="642" y="415">2 任务下发</text>
  <path class="flow" d="M820 610 H940"/>
  <text class="route" x="830" y="582">查询计划</text>
  <path class="flow" d="M1420 610 H1540"/>
  <text class="route" x="1430" y="582">调度</text>
  <path class="flow" d="M2010 610 H2180"/>
  <text class="route" x="2015" y="580">5 语义判断</text>
  <path class="flow" d="M2540 776 V824"/>
  <text class="route" x="2580" y="811">6 冲突解析</text>
  <path class="flow-dashed" d="M2180 958 H2090 V790 H1180 V715"/>
  <text class="route" x="1560" y="782">回补调度</text>
  <path class="flow" d="M1775 715 V824"/>
  <text class="route" x="1800" y="786">审计写入</text>
  <path class="flow" d="M2285 776 V800 H1950 V824"/>

  <!-- Receipt-root anchoring path -->
  <path class="flow" d="M1900 824 H2070 V388 H1235 V306"/>
  <text class="route" x="1450" y="378">7 审计回执 / 根锚定</text>

  <!-- Separate one-way paths between the DAG scheduler and source interface -->
  <path class="flow" d="M1020 715 V750 H470 V1148"/>
  <text class="route" x="490" y="790">3 取证请求：DAG → 源端接口</text>
  <path class="flow" d="M570 1148 V830 H1100 V715"/>
  <text class="route" x="590" y="875">4 证据返回：源端接口 → DAG</text>

  <!-- Heterogeneous evidence sources -->
  <rect class="soft" x="410" y="1148" width="2490" height="78"/>
  <text class="body" x="1655" y="1184" text-anchor="middle">源端访问接口</text>
  <text class="port" x="650" y="1217" text-anchor="middle">请求 ↓</text>
  <text class="port" x="900" y="1217" text-anchor="middle">↑ 返回</text>
  <text class="port" x="1450" y="1217" text-anchor="middle">请求 ↓</text>
  <text class="port" x="1750" y="1217" text-anchor="middle">↑ 返回</text>
  <text class="port" x="2300" y="1217" text-anchor="middle">请求 ↓</text>
  <text class="port" x="2700" y="1217" text-anchor="middle">↑ 返回</text>

  <rect class="box" x="410" y="1270" width="720" height="130"/>
  <text class="box-title" x="770" y="1323" text-anchor="middle">Hyperledger Fabric</text>
  <text class="small" x="770" y="1371" text-anchor="middle">区块头 · 背书 · 读写集</text>

  <rect class="box" x="1240" y="1270" width="720" height="130"/>
  <text class="box-title" x="1600" y="1323" text-anchor="middle">FISCO-BCOS</text>
  <text class="small" x="1600" y="1371" text-anchor="middle">交易回执 · 事件 · 状态证明</text>

  <rect class="box" x="2070" y="1270" width="830" height="130"/>
  <text class="box-title" x="2485" y="1323" text-anchor="middle">链下业务材料</text>
  <text class="small" x="2485" y="1371" text-anchor="middle">文档 · 数据库快照 · API 回执</text>

  <!-- Each source uses two independent, non-overlapping one-way arrows -->
  <path class="source-flow" d="M650 1226 V1270"/>
  <path class="source-flow" d="M900 1270 V1226"/>
  <path class="source-flow" d="M1450 1226 V1270"/>
  <path class="source-flow" d="M1750 1270 V1226"/>
  <path class="source-flow" d="M2300 1226 V1270"/>
  <path class="source-flow" d="M2700 1270 V1226"/>
</svg>
